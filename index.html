        }

        const menuConfig = {
            stakeholder: [{ id: 'beranda-stakeholder', icon: 'fa-file-pdf', label: 'Dokumen SP' }, { id: 'form-review', icon: 'fa-clipboard-list', label: 'Form Reviu Kebijakan' }],
            admin: [{ id: 'hasil-review', icon: 'fa-chart-pie', label: 'Matriks & Ekspor' }]
        };

        const setupNavigation = () => {
            const roleHtml = currentUserRole === 'admin' 
                ? '<span class="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-indigo-200"><i class="fas fa-shield-alt mr-1"></i> Admin Internal</span>' 
                : `<div class="bg-blue-50 border border-blue-100 p-3 rounded-xl"><p class="text-[11px] font-bold text-blue-500 uppercase tracking-wider mb-1">Profil Penilai</p><p class="text-sm font-bold text-slate-800 line-clamp-1" title="${stakeholderData.nama}">${stakeholderData.nama}</p><p class="text-xs text-slate-600 mt-0.5 line-clamp-1" title="${stakeholderData.jabatan} - ${stakeholderData.instansi}">${stakeholderData.jabatan} <br><span class="font-medium text-slate-500">${stakeholderData.instansi}</span></p></div>`;
            document.getElementById('sidebar-role').innerHTML = roleHtml;
            
            document.getElementById('nav-desktop').innerHTML = menuConfig[currentUserRole].map(m => `<button onclick="navigate('${m.id}')" id="navD-${m.id}" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-left font-medium text-slate-500 hover:bg-slate-100/50 hover:text-blue-600 transition-all border border-transparent"><i class="fas ${m.icon} w-5 text-center text-lg"></i> ${m.label}</button>`).join('');
            
            let mobileMenus = [...menuConfig[currentUserRole]]; if(currentUserRole === 'admin') mobileMenus.push({id:'logout', icon:'fa-power-off', label:'Keluar'});
            document.getElementById('nav-mobile').innerHTML = mobileMenus.map(m => { if(m.id === 'logout') return `<button onclick="logout()" class="flex flex-col items-center w-16 text-red-500"><i class="fas ${m.icon} text-xl mb-1"></i><span class="text-[10px] font-bold">Keluar</span></button>`; return `<button onclick="navigate('${m.id}')" id="navM-${m.id}" class="flex flex-col items-center w-20 py-1 text-slate-400 hover:text-blue-600 transition-colors"><i class="fas ${m.icon} text-xl mb-1 transition-transform"></i><span class="text-[10px] font-bold text-center leading-tight">${m.label}</span></button>`}).join('');
        };

        window.navigate = (pageId) => {
            menuConfig[currentUserRole].forEach(m => {
                const d = document.getElementById(`navD-${m.id}`), mb = document.getElementById(`navM-${m.id}`);
                if(d) { d.classList.toggle('bg-white', m.id===pageId); d.classList.toggle('text-blue-600', m.id===pageId); d.classList.toggle('shadow-sm', m.id===pageId); d.classList.toggle('border-slate-200', m.id===pageId); d.classList.toggle('text-slate-500', m.id!==pageId); }
                if(mb) { mb.classList.toggle('text-blue-600', m.id===pageId); mb.classList.toggle('text-slate-400', m.id!==pageId); }
            });
            renderPageContent(pageId);
        };

        // ==========================================
        // 4. RENDERER (UI/UX)
        // ==========================================
        const renderPageContent = (pageId) => {
            const content = document.getElementById('content-area');
            let html = '';

            if (pageId === 'beranda-stakeholder') {
                html = `
                    <div class="p-6 md:p-10 max-w-7xl mx-auto">
                        <header class="mb-8">
                            <span class="bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1 rounded-full mb-3 inline-block tracking-widest uppercase">Dokumen Standar Pelayanan</span>
                            <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-2 tracking-tight">Executive Summary</h2>
                            <p class="text-slate-500 text-lg max-w-3xl">Silakan cermati ringkasan spesifikasi dari 3 dokumen SK Standar Pelayanan di bawah ini. Sebagai Stakeholder, Anda diminta memberikan reviu kualitatif pada Komponen No. 2 s.d 14 (Scroll ke bawah pada tiap kartu untuk membaca detail komponen).</p>
                        </header>

                        <div class="grid gap-6 md:grid-cols-3 mb-10 items-stretch">
                            ${Object.keys(layananData).map(k => `
                                <div class="glass-card bento-hover p-6 rounded-[24px] ${layananData[k].tema.border} border-t-4 flex flex-col h-[600px] bg-white relative overflow-hidden group">
                                    
                                    <!-- Header Card -->
                                    <div class="flex justify-between items-start mb-4 flex-shrink-0">
                                        <div class="w-12 h-12 ${layananData[k].tema.bg} rounded-2xl flex items-center justify-center ${layananData[k].tema.text} text-xl group-hover:scale-110 transition-transform"><i class="fas ${layananData[k].icon}"></i></div>
                                        <span class="bg-slate-100 text-slate-500 text-xs font-bold px-2 py-1 rounded">${k}</span>
                                    </div>
                                    <h3 class="font-bold text-slate-800 text-lg leading-tight mb-2 flex-shrink-0">${layananData[k].judul}</h3>
                                    <p class="text-[11px] text-blue-600 font-semibold mb-4 border-b pb-3 flex-shrink-0">${layananData[k].deskripsi}</p>
                                    
                                    <!-- Scrollable Content for SP Components 2-14 -->
                                    <div class="space-y-4 flex-1 overflow-y-auto pr-2 sp-content-scroll pb-4">
                                        ${layananData[k].komponen.map(komp => `
                                            <div>
                                                <p class="text-[10px] uppercase font-bold text-slate-400 mb-1 leading-tight">${komp.no}. ${komp.nama}</p>
                                                <p class="text-xs font-medium text-slate-700 leading-relaxed">${komp.isi}</p>
                                            </div>
                                        `).join('')}
                                    </div>
                                    
                                    <!-- Gradient indicator for scrolling -->
                                    <div class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-white to-transparent pointer-events-none rounded-b-[24px]"></div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="glass p-8 rounded-3xl border border-blue-100 bg-gradient-to-r from-blue-50 to-indigo-50 flex flex-col md:flex-row items-center justify-between gap-6">
                            <div><h4 class="font-bold text-slate-800 text-lg">Siap memberikan reviu?</h4><p class="text-slate-600 text-sm mt-1">Lanjutkan ke formulir reviu kebijakan untuk menilai komponen SP secara formal.</p></div>
                            <button onclick="navigate('form-review')" class="w-full md:w-auto bg-slate-900 hover:bg-slate-800 text-white px-8 py-3.5 rounded-xl font-semibold transition-all shadow-lg active:scale-95">Buka Form Reviu <i class="fas fa-arrow-right ml-2"></i></button>
                        </div>
                    </div>
                `;
            } 
            else if (pageId === 'form-review') {
                html = `
                    <div class="p-6 md:p-10 max-w-5xl mx-auto pb-28">
                        <header class="mb-8">
                            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Formulir Reviu Standar Pelayanan</h2>
                            <p class="text-slate-500 text-lg">Penilaian dan masukan formal terhadap dokumen SK Standar Pelayanan.</p>
                        </header>
                        
                        <div class="glass-card p-6 md:p-8 mb-8 rounded-[24px]">
                            <div class="flex items-center gap-4 mb-6 border-b border-slate-100 pb-4"><div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-lg">1</div><div><h3 class="font-bold text-xl text-slate-800">Pilih Dokumen Layanan</h3><p class="text-sm text-slate-500">Centang dokumen SP yang akan Anda reviu (bisa lebih dari satu):</p></div></div>
                            <div class="space-y-3 pl-14">
                                ${Object.keys(layananData).map(k => `<label class="flex items-center p-4 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors"><input type="checkbox" class="cb-layanan w-5 h-5 text-blue-600" value="${k}" onchange="generateQuestions()"><span class="ml-4 font-medium text-slate-700">${layananData[k].judul}</span></label>`).join('')}
                            </div>
                        </div>

                        <div id="q-container"></div>

                        <div id="final-container" class="hidden glass-card p-6 md:p-8 mb-8 rounded-[24px]">
                            <div class="flex items-center gap-4 mb-6 border-b border-slate-100 pb-4"><div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-lg">3</div><div><h3 class="font-bold text-xl text-slate-800">Kesimpulan Akhir Reviu</h3></div></div>
                            <div class="space-y-6 pl-14 mb-8">
                                <div><label class="block text-sm font-semibold mb-2 text-slate-700">Secara umum, bagian mana yang sudah baik dan patut dipertahankan?</label><textarea id="essay_baik" rows="2" class="w-full p-4 border rounded-xl bg-slate-50 focus:bg-white outline-none focus:ring-2 focus:ring-blue-500"></textarea></div>
                                <div><label class="block text-sm font-semibold mb-2 text-slate-700">Kesimpulan atau catatan penutup dari Anda terkait Standar Pelayanan ini?</label><textarea id="essay_usulan" rows="3" class="w-full p-4 border rounded-xl bg-slate-50 focus:bg-white outline-none focus:ring-2 focus:ring-blue-500"></textarea></div>
                            </div>
                            <div class="bg-blue-50 p-6 rounded-2xl border-blue-100 pl-14 ml-14">
                                <label class="block font-bold text-blue-900 mb-4">Status Pengesahan Stakeholder terhadap Dokumen SP:</label>
                                ${['Disetujui tanpa perubahan', 'Disetujui dengan catatan penyesuaian', 'Perlu dilakukan perubahan/revisi mendalam'].map(v => `<label class="flex items-center gap-3 cursor-pointer p-3 bg-white mb-2 border border-blue-100 hover:border-blue-300 rounded-xl transition-colors"><input type="radio" name="kesimpulan" value="${v}" class="w-4 h-4 text-blue-600"><span class="font-semibold text-blue-900">${v}</span></label>`).join('')}
                            </div>
                        </div>

                        <button id="btn-submit" onclick="submitReview()" class="hidden w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 flex justify-center items-center gap-2"><i class="fas fa-paper-plane"></i> Kirim Dokumen Reviu</button>
                    </div>
                `;
            }
            else if (pageId === 'hasil-review') {
                html = `
                    <div class="p-6 md:p-10 h-full flex flex-col"><div class="flex justify-between items-center mb-8"><h2 class="text-3xl font-extrabold text-slate-900">Rekapitulasi Reviu SP</h2><button onclick="window.exportToCSV()" class="bg-green-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-lg flex items-center gap-2 hover:bg-green-700"><i class="fas fa-file-csv"></i> Ekspor CSV Detail</button></div>
                    <div class="glass-card flex-1 overflow-auto shadow-sm rounded-2xl border-t-4 border-indigo-500"><table class="w-full text-left"><thead class="bg-slate-50 text-slate-600 border-b text-sm"><th class="p-4">Profil Stakeholder</th><th class="p-4">Layanan Direviu</th><th class="p-4">Kesimpulan / Status</th><th class="p-4 text-center">Waktu Submit</th></thead>
                    <tbody id="table-reviews" class="divide-y divide-slate-100"><tr><td colspan="4" class="p-8 text-center text-slate-400">Memuat data...</td></tr></tbody></table></div></div>
                `;
                setTimeout(loadReviewsData, 100);
            }
            content.innerHTML = html;
        };

        // ==========================================
        // 5. GENERATE REVIU FORM KUALITATIF (KOMPONEN 2 - 14)
        // ==========================================
        window.toggleTextarea = (id, val) => {
            const ta = document.getElementById(id);
            if(val !== 'Sesuai') { ta.classList.add('show'); ta.setAttribute('required', 'true'); } 
            else { ta.classList.remove('show'); ta.removeAttribute('required'); ta.value = ''; }
        };

        window.generateQuestions = () => {
            const sel = Array.from(document.querySelectorAll('.cb-layanan:checked')).map(c=>c.value);
            const c = document.getElementById('q-container'); const f = document.getElementById('final-container'); const b = document.getElementById('btn-submit');
            if(!sel.length) { c.innerHTML=''; f.classList.add('hidden'); b.classList.add('hidden'); return; }

            let html = `<div class="glass-card p-6 md:p-8 mb-8 rounded-[24px]"><div class="flex items-center gap-4 mb-6 border-b pb-4"><div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-lg">2</div><div><h3 class="font-bold text-xl text-slate-800">Reviu Komponen Dokumen Standar Pelayanan</h3><p class="text-sm text-slate-500">Silakan beri penilaian kebijakan (No. 2 s/d 14). Berikan catatan apabila memilih 'Perlu Perubahan'.</p></div></div>`;
            
            sel.forEach(k => {
                const l = layananData[k];
                html += `<div class="ml-14 mb-10 p-6 border rounded-2xl bg-slate-50/50"><h4 class="font-bold ${l.tema.text} mb-6 flex items-center gap-2 pb-3 border-b border-slate-200"><i class="fas ${l.icon} text-xl"></i> ${l.judul}</h4><div class="space-y-6">` +
                komponenSPNames.map((komp, idx) => `
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-sm font-bold text-slate-800 mb-3">${idx+2}. ${komp}</p>
                        <div class="grid md:grid-cols-3 gap-3">
                            ${['Sesuai', 'Sesuai dengan Catatan', 'Perlu Perubahan'].map(v => `
                                <label class="status-radio cursor-pointer relative">
                                    <input type="radio" name="st_${k}_${idx}" value="${v}" class="sr-only" onchange="toggleTextarea('ta_${k}_${idx}', this.value)" required>
                                    <div class="flex items-center p-3 border border-slate-200 rounded-lg bg-slate-50 hover:bg-slate-100 transition-all h-full">
                                        <span class="radio-dot w-4 h-4 rounded-full border-2 border-slate-300 mr-3 flex-shrink-0 transition-colors"></span>
                                        <span class="text-xs font-semibold text-slate-700 leading-tight">${v}</span>
                                    </div>
                                </label>
                            `).join('')}
                        </div>
                        <textarea id="ta_${k}_${idx}" rows="2" class="textarea-collapse w-full p-3 border border-slate-300 rounded-lg bg-white outline-none ${l.tema.ring} text-sm" placeholder="Tuliskan catatan/alasan spesifik atau usulan redaksional Anda pada komponen ini..."></textarea>
                    </div>
                `).join('') + `</div></div>`;
            });
            c.innerHTML = html + `</div>`; f.classList.remove('hidden'); b.classList.remove('hidden');
        };

        window.submitReview = async () => {
            const sel = Array.from(document.querySelectorAll('.cb-layanan:checked')).map(c=>c.value);
            let complete = true; const hasilReviu = {};
            
            sel.forEach(k => {
                hasilReviu[k] = {};
                komponenSPNames.forEach((komp, i) => {
                    const c = document.querySelector(`input[name="st_${k}_${i}"]:checked`);
                    if(!c) complete = false; 
                    else { 
                        const catatan = document.getElementById(`ta_${k}_${i}`).value.trim();
                        // Jika memilih selain Sesuai, wajib isi catatan
                        if(c.value !== 'Sesuai' && catatan === '') complete = false;
                        hasilReviu[k][`komp_${i+2}`] = { nama_komponen: komp, status: c.value, catatan: catatan || '-' }; 
                    }
                });
            });
            const kes = document.querySelector(`input[name="kesimpulan"]:checked`);
            if(!complete) return showToast('Harap pilih status tiap komponen. Isi catatan jika memilih "Perlu Perubahan".', 'error');
            if(!kes) return showToast('Pilih Kesimpulan Akhir', 'error');

            showLoader('Mengirim Dokumen Reviu...');
            try {
                const payload = {
                    profil_penilai: stakeholderData, layanan_dipilih: sel, reviu_komponen: hasilReviu,
                    catatan_akhir: { baik: document.getElementById('essay_baik').value || '-', usulan: document.getElementById('essay_usulan').value || '-' },
                    kesimpulan_akhir: kes.value, timestamp: IS_PREVIEW ? new Date() : serverTimestamp()
                };

                if(!IS_PREVIEW) await addDoc(collection(db, "reviews"), payload);
                else await new Promise(r => setTimeout(r, 1200)); // Simulasi delay
                
                document.getElementById('content-area').innerHTML = `<div class="h-full flex flex-col items-center justify-center p-6 text-center max-w-lg mx-auto"><div class="w-24 h-24 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-5xl mb-6"><i class="fas fa-file-signature"></i></div><h2 class="text-3xl font-bold text-slate-800 mb-3">Dokumen Reviu Terekam</h2><p class="text-slate-600 mb-8 leading-relaxed">Terima kasih <b>${stakeholderData.nama}</b>, reviu kebijakan terhadap Standar Pelayanan telah berhasil disubmit. Data Anda akan menjadi bahan evaluasi dan perbaikan formil kami.</p><button onclick="logout()" class="px-8 py-3.5 bg-white border border-slate-300 rounded-xl text-slate-700 font-bold hover:bg-slate-50 shadow-sm transition-all active:scale-95">Selesai & Keluar</button></div>`;
            } catch (e) { showToast('Gagal mengirim', 'error'); } finally { hideLoader(); }
        };

        let currentReviewsData = [];
        const loadReviewsData = async () => {
            const tbody = document.getElementById('table-reviews');
            if(IS_PREVIEW) { tbody.innerHTML = `<tr class="hover:bg-slate-50"><td class="p-4"><p class="font-bold text-slate-800">Budi Santoso</p><p class="text-xs text-slate-500">Direktur - PT Demo</p></td><td class="p-4"><span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-bold border border-blue-200">SP-01</span></td><td class="p-4"><span class="bg-yellow-50 text-yellow-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-yellow-200 block w-max">Disetujui dengan catatan</span></td><td class="p-4 text-center text-xs text-slate-400">Baru saja</td></tr>`; return; }
            try {
                const snap = await getDocs(collection(db, 'reviews')); currentReviewsData = []; let html = '';
                snap.forEach(d => { 
                    const dt = d.data(); currentReviewsData.push(dt); 
                    const time = dt.timestamp ? new Date(dt.timestamp.toDate()).toLocaleDateString('id-ID') : '-';
                    let kesBg = dt.kesimpulan_akhir.includes('tanpa') ? 'bg-green-50 text-green-700 border-green-200' : (dt.kesimpulan_akhir.includes('Perlu') ? 'bg-red-50 text-red-700 border-red-200' : 'bg-yellow-50 text-yellow-700 border-yellow-200');
                    html += `<tr class="hover:bg-slate-50 transition-colors"><td class="p-4"><p class="font-bold text-slate-800">${dt.profil_penilai.nama}</p><p class="text-xs text-slate-500">${dt.profil_penilai.jabatan} - <b>${dt.profil_penilai.instansi}</b></p></td><td class="p-4">${dt.layanan_dipilih.map(l=>`<span class="bg-slate-100 text-slate-700 px-2 py-1 rounded text-xs font-bold border border-slate-200 mr-1 inline-block mb-1">${l}</span>`).join('')}</td><td class="p-4"><span class="${kesBg} px-3 py-1.5 rounded-lg text-[11px] font-bold border block w-max uppercase tracking-wide">${dt.kesimpulan_akhir}</span></td><td class="p-4 text-center text-xs font-medium text-slate-400">${time}</td></tr>`; 
                });
                tbody.innerHTML = html || '<tr><td colspan="4" class="p-8 text-center text-slate-500">Belum ada data reviu.</td></tr>';
            } catch (e) { tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-red-500">Error memuat data</td></tr>`; }
        };

        window.exportToCSV = () => {
            if(IS_PREVIEW) return showToast('Fitur Export Data Aktif (Preview)', 'success');
            if(!currentReviewsData.length) return showToast('Tidak ada data untuk diekspor', 'error');
            
            // Format CSV Detail per Item
            let csv = "Nama Penilai,Jabatan,Instansi,Dokumen SP,No Komponen,Nama Komponen,Status Reviu,Catatan/Alasan,Kesimpulan Dokumen\n";
            currentReviewsData.forEach(dt => { 
                const profil = `"${dt.profil_penilai.nama}","${dt.profil_penilai.jabatan}","${dt.profil_penilai.instansi}"`;
                const kesimpulan = `"${dt.kesimpulan_akhir}"`;
                
                dt.layanan_dipilih.forEach(k => {
                    const docName = `"${layananData[k].judul}"`;
                    if(dt.reviu_komponen && dt.reviu_komponen[k]) {
                        Object.keys(dt.reviu_komponen[k]).forEach(kompKey => {
                            const item = dt.reviu_komponen[k][kompKey];
                            csv += `${profil},${docName},"${kompKey.replace('komp_','')}","${item.nama_komponen}","${item.status}","${item.catatan.replace(/"/g, '""')}",${kesimpulan}\n`;
                        });
                    }
                });
            });
            const link = document.createElement("a"); link.href = encodeURI("data:text/csv;charset=utf-8," + csv); link.download = "Rekap_Reviu_Standar_Pelayanan.csv";
            document.body.appendChild(link); link.click(); link.remove();
        };
    </script>
</body>
</html>
